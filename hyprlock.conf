# nodaysidle Kiln — Hyprlock
$color        = rgba(16, 12, 10, 1.0)
$inner_color  = rgba(8, 6, 5, 0.70)
$outer_color  = rgba(E8703AFF) rgba(E9B44CEE) rgba(8A5A3BCC) rgba(100C0AF2) 45deg
$font_color   = rgba(237, 227, 214, 1.0)
$check_color  = rgba(232, 112, 58, 1.0)

background {
    monitor =
    path = screenshot
    blur_passes = 0
    color = rgba(10, 7, 6, 0.55)
}

input-field {
    monitor =
    size = 260, 52
    outline_thickness = 2
    dots_size = 0.20
    dots_spacing = 0.35
    dots_center = true
    outer_color = $outer_color
    inner_color = $inner_color
    font_color = $font_color
    fade_on_empty = false
    placeholder_text = <span foreground="##8A5A3B">password</span>
    check_color = $check_color
    fail_color = rgba(D64545FF)
    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = $font_color
    font_size = 72
    font_family = JetBrainsMono Nerd Font
    position = 0, 120
    halign = center
    valign = center
}
